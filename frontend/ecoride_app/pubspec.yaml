publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  tabler_icons_plus: ^3.50.0
  http: ^1.2.2 # เรียก REST API ของ backend (lib/data/api_client.dart)
  web: ^1.1.0 # ใช้เปิดหน้าต่างเลือกรูปบนเบราว์เซอร์ (ไม่ใช่ปลั๊กอิน ไม่ต้องเปิด Developer Mode)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
